[package]
name = "instagram-private-api-rust"
version = "0.1.0"
edition = "2021"
description = "Rust migration scaffold for instagram-private-api"
license = "MIT"

[lib]
path = "rust/src/lib.rs"

[workspace]
members = ["."]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
thiserror = "1"
